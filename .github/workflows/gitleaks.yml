# Secret scan of the pull request's commits with gitleaks: the org-wide reusable
# workflow of maestra-io/github-actions (official gitleaks/gitleaks-action, central
# config and license). Check name: `gitleaks / gitleaks`. The previous repo-own
# workflow needed MINDBOX_GITLEAKS_LICENSE, which this org does not have.
name: gitleaks

on: pull_request

permissions:
  contents: read
  pull-requests: write # the PR's commit list, and a review comment per finding

jobs:
  gitleaks:
    uses: maestra-io/github-actions/.github/workflows/gitleaks.yml@main
    secrets: inherit
