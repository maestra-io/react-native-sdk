name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Public repo: the org's RunsOn runner group does not serve public repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      # `prepare` runs `bob build` (commonjs, module, typescript) as part of the install.
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn tsc --noEmit -p tsconfig.build.json
      - run: yarn lint
      - run: yarn test --ci
